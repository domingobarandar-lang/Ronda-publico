<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Informe de ronda — Rondas QR</title>
  <link rel="icon" href="icono.svg" type="image/svg+xml">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="informe" id="contenido">
    <p class="nota">Cargando informe…</p>
  </div>
  <script>
    // Con qué se hizo cada marca (CU-28). Mismo texto que lib/informes.js.
    const MEDIOS = { nfc: '📶 NFC', qr: '📷 QR', manual: '⌨️ a mano' };
    const CHIPS = {
      completa: '<span class="chip chip-verde">Completa</span>',
      completa_obs: '<span class="chip chip-ambar">Completa con observaciones</span>',
      sospechosa: '<span class="chip chip-roja">🔴 SOSPECHOSA</span>',
      incompleta: '<span class="chip chip-roja">INCOMPLETA</span>',
      en_curso: '<span class="chip">En curso</span>'
    };
    const esc = t => String(t == null ? '' : t).replace(/</g, '&lt;');
    const fecha = ts => ts ? new Date(ts).toLocaleString('es-CL') : '—';
    const horaCorta = ts => ts ? new Date(ts).toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' }) : '';
    // Marca por cercanía (CU-29). Mismo texto que detalleCercania() de lib/informes.js.
    const minutos = ms => { const m = Math.round(ms / 60000); return m >= 1 ? `${m} min` : `${Math.round(ms / 1000)} s`; };
    const cercania = d => d.distanciaM == null ? '' : ` (a ${d.distanciaM} m${d.edadGpsMs != null ? ` hace ${minutos(d.edadGpsMs)}` : ''}; `
      + `al marcar, ${d.distanciaAhoraM != null ? `a ${d.distanciaAhoraM} m` : 'sin señal'})`;

    (async () => {
      const cont = document.getElementById('contenido');
      const id = new URLSearchParams(location.search).get('id');
      const sesion = JSON.parse(localStorage.getItem('rondasqr-admin') || 'null');
      if (!id || !sesion) { cont.innerHTML = '<p class="nota">Abre este informe desde el panel del administrador.</p>'; return; }
      // Mismo condominio que el panel (el informe se busca dentro de ese).
      const activo = (sesion.condominioActivo && sesion.condominioActivo.id) ||
        (sesion.condominio && sesion.condominio.id) || '';
      const resp = await fetch('/api/admin/informes/' + id, {
        headers: { authorization: 'Bearer ' + sesion.token, ...(activo ? { 'x-condominio': activo } : {}) }
      });
      if (!resp.ok) { cont.innerHTML = '<p class="nota">No se pudo cargar el informe (¿sesión caducada?).</p>'; return; }
      const inf = await resp.json();

      const faltantes = inf.detalle.filter(d => d.faltante);
      const dur = inf.evaluacion ? inf.evaluacion.duracionMin + ' min' : '—';
      cont.innerHTML = `
        <div class="informe-cabecera">
          <div>
            <h1>Informe de ronda</h1>
            <p class="nota">${esc(inf.condominio)}</p>
          </div>
          <button class="btn btn-borde no-imprimir" onclick="window.print()">🖨️ Imprimir</button>
        </div>
        <table>
          <tr><th>Ronda</th><td>${esc(inf.ronda)}</td></tr>
          <tr><th>Guardia</th><td>${esc(inf.guardia)}</td></tr>
          <tr><th>Inicio</th><td>${fecha(inf.inicio)}</td></tr>
          <tr><th>Fin</th><td>${fecha(inf.fin)}</td></tr>
          <tr><th>Duración</th><td>${dur}</td></tr>
          <tr><th>Resultado</th><td>${CHIPS[inf.estado] || esc(inf.estado)}</td></tr>
        </table>
        ${faltantes.length ? `<div class="alerta-grande">⚠️ ${faltantes.length} punto(s) sin marcar: ${faltantes.map(f => esc(f.nombre)).join(', ')}</div>` : ''}
        ${inf.evaluacion && (inf.evaluacion.sospechas || []).length
          ? `<div class="alerta-grande">🔴 Datos sospechosos — esta ronda no se pudo verificar:<br>${inf.evaluacion.sospechas.map(s => '• ' + esc(s)).join('<br>')}</div>`
          : ''}
        ${inf.evaluacion && inf.evaluacion.observaciones.length
          ? `<div class="observaciones"><strong>Observaciones</strong><br>${inf.evaluacion.observaciones.map(o => '• ' + esc(o)).join('<br>')}</div>`
          : ''}
        ${inf.comentario
          ? `<div class="observaciones"><strong>Comentario del guardia</strong><br>${esc(inf.comentario)}</div>`
          : ''}
        <h3 style="margin-top:18px">Detalle por punto</h3>
        ${inf.detalle.map(d => `
          <div class="detalle-punto">
            <div style="width:26px; text-align:right; color:var(--texto-suave)">${d.orden}.</div>
            <div style="flex:1">${esc(d.nombre)}${d.lejos ? ` <span class="faltante">⚠️ a ${d.distanciaM} m del punto</span>` : ''}${!d.lejos && d.porCercania && !d.anclado ? ` <span class="nota" title="El GPS no alcanzaba al marcar; el teléfono estuvo cerca del punto poco antes">📍 por cercanía${cercania(d)}</span>` : ''}</div>
            <div>
              ${d.faltante ? '<span class="faltante">FALTANTE</span>' : '✅ ' + horaCorta(d.hora) + (MEDIOS[d.medio] ? ` <span class="nota">${MEDIOS[d.medio]}</span>` : '') + (d.offline ? ' <span class="nota">(offline)</span>' : '')}
              ${d.gps ? ` <a class="nota" href="https://maps.google.com/?q=${d.gps.lat},${d.gps.lon}" target="_blank" title="Dónde se hizo la marca">🗺️</a>` : ''}
            </div>
          </div>`).join('')}
        <p class="nota" style="margin-top:16px">Generado por Rondas QR.</p>`;
    })();
  </script>
</body>
</html>
