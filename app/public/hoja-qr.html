<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hoja de QR — Rondas QR</title>
  <link rel="icon" href="icono.svg" type="image/svg+xml">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="hoja">
    <div class="no-imprimir" style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
      <p class="nota">Imprime esta hoja, recorta cada tarjeta y pégala protegida (mica/termolaminado) en su sector.</p>
      <button class="btn btn-principal" onclick="window.print()">🖨️ Imprimir</button>
    </div>
    <h1 id="titulo">Puntos de control</h1>
    <div id="grilla" class="grilla-qr"></div>
  </div>
  <script>
    (async () => {
      const sesion = JSON.parse(localStorage.getItem('rondasqr-admin') || 'null');
      if (!sesion) { document.getElementById('grilla').innerHTML = '<p class="nota">Inicia sesión en el panel primero.</p>'; return; }
      // El condominio elegido en el panel viaja en la sesión: sin esto la hoja
      // saldría con los QR del condominio de la cuenta, no del que está en pantalla.
      const activo = (sesion.condominioActivo && sesion.condominioActivo.id) ||
        (sesion.condominio && sesion.condominio.id) || '';
      const resp = await fetch('/api/admin/hoja-qr', {
        headers: { authorization: 'Bearer ' + sesion.token, ...(activo ? { 'x-condominio': activo } : {}) }
      });
      if (!resp.ok) { document.getElementById('grilla').innerHTML = '<p class="nota">No se pudo cargar (¿sesión caducada?). Vuelve al panel.</p>'; return; }
      const datos = await resp.json();
      document.getElementById('titulo').textContent = 'Puntos de control — ' + datos.condominio;
      // Los puntos con chapita NFC no llevan QR: salen marcados, sin código,
      // para que la hoja siga mostrando todos los puntos del condominio. El
      // código a mano tampoco se imprime: es el respaldo del administrador
      // si la chapita se rompe, y pegado junto a ella se marcaría sin acercarse.
      document.getElementById('grilla').innerHTML = datos.puntos.map(p => p.nfc ? `
        <div class="tarjeta-qr tarjeta-nfc">
          <div class="chapita-nfc">📶</div>
          <div class="nombre">${p.nombre.replace(/</g, '&lt;')}</div>
          <div class="nota">Chapita NFC — no lleva QR</div>
        </div>` : `
        <div class="tarjeta-qr">
          <img src="${p.dataUrl}" alt="QR ${p.nombre}">
          <div class="nombre">${p.nombre.replace(/</g, '&lt;')}</div>
          <div class="codigo">${p.codigoCorto}</div>
        </div>`).join('');
    })();
  </script>
</body>
</html>
